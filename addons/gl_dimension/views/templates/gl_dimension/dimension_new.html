{% extends "base.html" %}
{% block title %}New GL dimension value{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/setup_master_pages.css') }}?v=1" />

<div class="im-page setup-im-page">
  <div class="im-topbar">
    <div class="im-topbar-main">
      <h1>
        GL dimension /
        <span class="im-ref">New value</span>
        <span class="status-badge status-badge--new">New</span>
      </h1>
      <div class="im-actions">
        <button type="submit" form="gdim-new-form" class="im-btn-save">Save</button>
        <a href="{{ url_for('gl_dimension.gl_dimension_list') }}" class="im-btn-secondary">Cancel</a>
        <a href="{{ url_for('gl_dimension.gl_dimension_list') }}" class="im-btn-secondary">List</a>
      </div>
    </div>
  </div>

  <section class="setup-im-shell customer-form-shell itemmaster-container">
    <form method="post" id="gdim-new-form">
      <div class="cf-form-stack">
        <div class="cf-form-panel">
          <h2 class="cf-section-title">Dimension value</h2>
          <div class="customer-details">
            <div class="form-group">
              <label for="dim_type">
                <span>Dimension type</span>
                <select id="dim_type" name="dim_type" required>
                  {% for t in dim_types %}
                  <option value="{{ t }}" {% if (row or {}).get('dim_type', '') == t %}selected{% endif %}>{{ dim_type_label(t) }}</option>
                  {% endfor %}
                </select>
              </label>
            </div>
            <div class="form-group">
              <label for="dim_code">
                <span>Code</span>
                <input id="dim_code" name="dim_code" type="text" maxlength="30" required class="input"
                  value="{{ (row or {}).get('dim_code', '') }}" autocomplete="off" />
              </label>
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
              <label for="dim_name">
                <span>Name</span>
                <input id="dim_name" name="dim_name" type="text" maxlength="200" class="input"
                  value="{{ (row or {}).get('dim_name', '') }}" autocomplete="off" />
              </label>
            </div>
            <div class="form-group">
              <label for="sort_order">
                <span>Sort order</span>
                <input id="sort_order" name="sort_order" type="number" class="input" value="{{ (row or {}).get('sort_order', 0) }}" />
              </label>
            </div>
            <div class="form-group">
              <label>
                <span>Active</span>
                <span style="display:inline-flex;align-items:center;gap:8px;">
                  <input type="checkbox" name="active" value="1" {% if not row or ((row or {}).get('active', 'Y')|upper == 'Y') %}checked{% endif %} />
                  <span style="font-size:13px;color:#495057;">Yes</span>
                </span>
              </label>
            </div>
          </div>
          <p class="field-hint-inline">Code is stored uppercase (max 30 characters).</p>
        </div>
      </div>
    </form>
  </section>
</div>
{% endblock %}
