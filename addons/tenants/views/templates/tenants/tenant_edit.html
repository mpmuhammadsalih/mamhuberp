{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/setup_master_pages.css') }}?v=1" />
<style>
  .setup-im-page .tenant-details { display: grid; grid-template-columns: 1fr 1fr; gap: 0 48px; margin-bottom: 8px; }
  .setup-im-page .tenant-details .form-group { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; min-height: 32px; }
  .setup-im-page .tenant-details .form-group label { margin: 0; min-width: 140px; font-size: 13px; font-weight: 400; color: #495057; flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; flex: 1; }
  .setup-im-page .tenant-details .form-group label > span { min-width: 140px; flex-shrink: 0; }
  .setup-im-page .tenant-details .form-group .input, .setup-im-page .tenant-details .form-group input[type="text"], .setup-im-page .tenant-details .form-group input[type="password"], .setup-im-page .tenant-details .form-group input[type="number"], .setup-im-page .tenant-details .form-group select { flex: 1; min-width: 0; font-size: 13px; padding: 6px 0; border: none; border-bottom: 1px solid #dee2e6; border-radius: 0; background: transparent; }
  .setup-im-page .tenant-details .form-group .input:focus, .setup-im-page .tenant-details .form-group select:focus { outline: none; border-bottom-color: var(--nexa-focus-color); }
  .setup-im-page .tenant-details .form-group label small { width: 100%; margin-top: 2px; font-size: 12px; color: #6c757d; }
  .setup-im-page .tenant-actions { display: none; }
  @media (max-width: 1024px) { .setup-im-page .tenant-details { grid-template-columns: 1fr; } }
</style>
<div class="im-page setup-im-page">
  <div class="im-topbar">
    <div class="im-topbar-main">
      <h1>Tenants / <span class="im-ref">{{ tenant.tenant_id or '—' }}</span></h1>
      <div class="im-actions">
        <button type="submit" form="tenantForm" class="im-btn-save">Update tenant</button>
        <a href="{{ url_for('tenants.tenant_list') }}" class="im-btn-secondary">Cancel</a>
        <a href="{{ url_for('tenants.tenant_list') }}" class="im-btn-secondary">List</a>
      </div>
    </div>
  </div>

  <section class="setup-im-shell customer-form-shell itemmaster-container">
    <div class="cf-form-stack">
      <div class="cf-form-panel">
        <h2 class="cf-section-title">Tenant details</h2>
        <p class="field-hint-inline" style="margin:6px 12px 8px;">Tenant ID cannot be changed. Save via toolbar <strong>Update tenant</strong>. Enter does not submit.</p>
  <form id="tenantForm" method="post" enctype="multipart/form-data">
    <input type="hidden" name="tenant_id" value="{{ tenant.tenant_id or '' }}" />
    <div class="customer-details tenant-details">
      <div class="form-group">
        <label for="tenant_id_display">
          <span>Tenant ID</span>
          <input type="text" id="tenant_id_display" value="{{ tenant.tenant_id or '' }}" readonly class="input" tabindex="-1" style="background: transparent; color: #6c757d; cursor: not-allowed;" />
          <small class="muted">Short code (cannot be changed).</small>
        </label>
      </div>
      <div class="form-group">
        <label for="display_name">
          <span>Display Name</span>
          <input type="text" id="display_name" name="display_name" value="{{ tenant.display_name or '' }}" placeholder="e.g. Head Office" maxlength="200" class="input" />
        </label>
      </div>
      <div class="form-group">
        <label for="network_link">
          <span>Network Link</span>
          <input type="text" id="network_link" name="network_link" value="{{ tenant.network_link or '' }}" placeholder="e.g. \\\\SERVER\\Share or https://..." maxlength="500" class="input" />
        </label>
      </div>
      <div class="form-group">
        <label>
          <span>Current Logo</span>
          {% if tenant.get('logo_path') %}
            <img src="{{ url_for('static', filename=tenant.get('logo_path')) }}" alt="Tenant Logo" style="height: 42px; width: auto; max-width: 120px; object-fit: contain; border: 1px solid #dee2e6; padding: 3px; background: #fff;">
          {% else %}
            <span class="muted">No logo uploaded</span>
          {% endif %}
          <small class="muted">Logo is shown in tenant list preview.</small>
        </label>
      </div>
      <div class="form-group">
        <label for="logo">
          <span>Upload New Logo</span>
          <input type="file" id="logo" name="logo" accept=".png,.jpg,.jpeg,.webp" class="input" />
          <small class="muted">Optional. Upload to replace current logo.</small>
        </label>
      </div>
      <div class="form-group">
        <label for="ip">
          <span>IP Address</span>
          <input type="text" id="ip" name="ip" class="input" value="{{ tenant.get('ip') or tenant.get('IP') or '' }}" required placeholder="e.g. 192.168.1.225" maxlength="45" autocomplete="off" />
          <small class="muted">Database server IP. Change and click Update Tenant to save.</small>
        </label>
      </div>
      <div class="form-group">
        <label for="port">
          <span>Port</span>
          <input type="text" id="port" name="port" value="{{ tenant.port or '' }}" required placeholder="e.g. 1521" maxlength="10" class="input" />
        </label>
      </div>
      <div class="form-group">
        <label for="service_name">
          <span>Service Name</span>
          <input type="text" id="service_name" name="service_name" value="{{ tenant.service_name or '' }}" required placeholder="e.g. rgc or rgc_ho" maxlength="100" class="input" />
          <small class="muted">Oracle service name (DSN is built as IP:PORT/SERVICE_NAME).</small>
        </label>
      </div>
      <div class="form-group">
        <label for="username">
          <span>Database Username</span>
          <input type="text" id="username" name="username" value="{{ tenant.username or '' }}" placeholder="Optional" maxlength="100" class="input" />
        </label>
      </div>
      <div class="form-group">
        <label for="password">
          <span>Database Password</span>
          <input type="password" id="password" name="password" placeholder="Leave blank to keep current" maxlength="255" class="input" />
        </label>
      </div>
      <div class="form-group">
        <label for="locationcode">
          <span>Location Code</span>
          <input type="number" id="locationcode" name="locationcode" value="{{ tenant.locationcode if tenant.locationcode is not none else '' }}" placeholder="Optional numeric code" step="1" class="input" />
        </label>
      </div>
      <div class="form-group">
        <label for="active_flag">
          <span>Status</span>
          <select id="active_flag" name="active_flag">
            <option value="Y" {% if (tenant.active_flag or 'Y') == 'Y' %}selected{% endif %}>Active</option>
            <option value="N" {% if (tenant.active_flag or '') == 'N' %}selected{% endif %}>Inactive</option>
          </select>
        </label>
      </div>
    </div>
    <div class="tenant-actions">
      <button type="submit" class="page-po__btn-primary">Update Tenant</button>
      <a href="{{ url_for('tenants.tenant_list') }}" class="page-po__btn-secondary" style="margin-left: 8px;">Cancel</a>
    </div>
  </form>
      </div>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
(function() {
  function blockEnterSubmit(e) {
    if (e.key !== 'Enter') return;
    var el = e.target;
    if (!el || el.tagName === 'TEXTAREA' || el.tagName === 'BUTTON') return;
    if (el.tagName === 'INPUT' && el.type === 'submit') return;
    e.preventDefault();
  }
  document.addEventListener('DOMContentLoaded', function() {
    var ipInput = document.getElementById('ip');
    if (ipInput) {
      ipInput.removeAttribute('readonly');
      ipInput.removeAttribute('disabled');
    }
    var f = document.getElementById('tenantForm');
    if (f) f.addEventListener('keydown', blockEnterSubmit);
  });
})();
</script>
{% endblock %}
