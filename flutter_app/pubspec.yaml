name: nexa_erp_mobile
description: ERP mobile app starter integrated with existing ERP APIs.
publish_to: "none"
version: 1.0.0+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  mobile_scanner: ^5.1.1
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  blue_thermal_printer: ^1.2.3
  open_filex: ^4.7.0
  share_plus: ^10.1.4
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/nexus-erp-logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/nexus-erp-logo.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/nexus-erp-logo.png

flutter_native_splash:
  color: "#000000"
  image: assets/images/nexus-erp-logo.png
  android: true
  ios: false
  web: false
