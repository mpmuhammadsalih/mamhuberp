{% extends "base.html" %}
{% block content %}
<style>
  .page { max-width: 96vw; width: 96vw; margin: 0 auto; padding: 16px 10px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #dee2e6; padding-bottom: 8px; }
  .title { margin: 0; font-size: 20px; font-weight: 400; color: #212529; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid #dee2e6; background: #fff; color: #0f172a; border-radius: 4px; padding: 6px 10px; font-size: 12px; text-decoration: none; cursor: pointer; }
  .btn-primary { background: #007bff; border-color: #007bff; color: #fff; }
  .grid { display: grid; grid-template-columns: 140px 140px 1fr; gap: 8px; margin-bottom: 10px; }
  .input, .select { width: 100%; border: 1px solid #dee2e6; border-radius: 4px; padding: 6px 8px; font-size: 12px; box-sizing: border-box; }
  .table-wrap { overflow: auto; max-height: 74vh; border: 1px solid #adb5bd; border-radius: 4px; background: #fff; }
  table { width: 100%; min-width: 900px; border-collapse: collapse; table-layout: fixed; font-size: 11px; }
  th, td { border: 1px solid #adb5bd; padding: 6px 8px; text-align: left; box-sizing: border-box; vertical-align: top; }
  th { position: sticky; top: 0; background: #f8f9fa; z-index: 1; white-space: nowrap; }
  td.msg { white-space: pre-wrap; word-break: break-word; }
  .lvl-ERROR td { background: #fee2e2; }
  .lvl-WARNING td { background: #fef9c3; }
  .lvl-INFO td { background: #ecfeff; }
  .empty { padding: 14px; color: #6c757d; font-style: italic; }
</style>

<div class="page">
  <div class="top">
    <h1 class="title">System Logs</h1>
  </div>

  <form method="get" action="{{ url_for('reports.system_logs') }}">
    <div class="grid">
      <input class="input" type="number" name="hours" min="1" max="720" value="{{ filters.hours or '48' }}" placeholder="Hours" />
      <select class="select" name="level">
        <option value="" {% if not filters.level %}selected{% endif %}>All Levels</option>
        <option value="ERROR" {% if filters.level == 'ERROR' %}selected{% endif %}>ERROR</option>
        <option value="WARNING" {% if filters.level == 'WARNING' %}selected{% endif %}>WARNING</option>
        <option value="INFO" {% if filters.level == 'INFO' %}selected{% endif %}>INFO</option>
      </select>
      <input class="input" type="text" name="q" value="{{ filters.q or '' }}" placeholder="Search text..." />
    </div>
    <div class="actions" style="margin-bottom: 10px;">
      <button class="btn btn-primary" type="submit">Apply</button>
      <a class="btn" href="{{ url_for('reports.system_logs') }}">Last 48h</a>
    </div>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:160px;">Timestamp</th>
          <th style="width:90px;">Level</th>
          <th style="width:180px;">Logger</th>
          <th>Message</th>
        </tr>
      </thead>
      <tbody>
        {% for r in rows %}
        <tr class="lvl-{{ r.level or '' }}">
          <td>{{ r.timestamp or '' }}</td>
          <td>{{ r.level or '' }}</td>
          <td>{{ r.logger or '' }}</td>
          <td class="msg">{{ r.message or '' }}</td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="empty">No logs found for selected window/filter.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
