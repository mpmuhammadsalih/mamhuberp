{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/im_form_shell.css') }}?v=1" />
<style>
  main.container:has(> .cp-page.im-form-shell-page) { padding-top: 0; }
  .cp-page .cp-alert {
    margin: 0 0 8px;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.4;
    grid-column: 1 / -1;
  }
  .cp-page .cp-alert--error {
    background: #fef2f2;
    color: #991b1b;
    border: 1px solid #fecaca;
  }
  .cp-page .cp-alert--success {
    background: #ecfdf5;
    color: #047857;
    border: 1px solid #bbf7d0;
  }
  .cp-page .cp-field-hint {
    margin: 2px 0 0 140px;
    font-size: 11px;
    color: #6c757d;
    line-height: 1.25;
    grid-column: 1 / -1;
  }
  @media (max-width: 900px) {
    .cp-page .cp-field-hint { margin-left: 0; }
  }
</style>

<div class="im-page im-form-shell-page cp-page">
  <div class="im-topbar">
    <div class="im-topbar-main">
      <h1>Change password / <span class="im-ref">{{ session.get('user') or 'Account' }}</span></h1>
      <div class="im-actions">
        <button type="submit" form="changePasswordForm" class="im-btn-save" id="submitBtn">Change password</button>
        <button type="button" class="im-btn-secondary po-toolbar-btn" onclick="window.location.href='{{ url_for('dashboard.dashboard') }}'">Cancel</button>
      </div>
    </div>
  </div>

  <section class="itemmaster-container cp-form-body">
    <h2 class="im-section-title">Account security</h2>
    <div class="form-section im-panel-body">
      <form id="changePasswordForm" class="form-grid--2cols cp-details" autocomplete="off">
        <div id="alertContainer"></div>

        <div class="form-group">
          <label for="oldPassword">Old password</label>
          <input type="password" class="input" id="oldPassword" name="old_password" required autocomplete="current-password" placeholder="Enter current password" />
        </div>

        <div class="form-group">
          <label for="newPassword">New password</label>
          <input type="password" class="input" id="newPassword" name="new_password" required autocomplete="new-password" minlength="6" placeholder="Enter new password" />
        </div>
        <p class="cp-field-hint">Must be at least 6 characters and different from your old password.</p>

        <div class="form-group">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" class="input" id="confirmPassword" name="confirm_password" required autocomplete="new-password" minlength="6" placeholder="Re-enter new password" />
        </div>
      </form>
    </div>
  </section>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('changePasswordForm');
  const alertContainer = document.getElementById('alertContainer');
  const submitBtn = document.getElementById('submitBtn');

  function showAlert(message, type) {
    type = type || 'error';
    alertContainer.innerHTML = '<div class="cp-alert cp-alert--' + type + '">' + message + '</div>';
    alertContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function clearAlert() {
    alertContainer.innerHTML = '';
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    clearAlert();

    const oldPassword = document.getElementById('oldPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!oldPassword) {
      showAlert('Old password is required');
      document.getElementById('oldPassword').focus();
      return;
    }
    if (!newPassword) {
      showAlert('New password is required');
      document.getElementById('newPassword').focus();
      return;
    }
    if (newPassword.length < 6) {
      showAlert('New password must be at least 6 characters long');
      document.getElementById('newPassword').focus();
      return;
    }
    if (newPassword !== confirmPassword) {
      showAlert('New password and confirm password do not match');
      document.getElementById('confirmPassword').focus();
      return;
    }
    if (oldPassword === newPassword) {
      showAlert('New password must be different from old password');
      document.getElementById('newPassword').focus();
      return;
    }

    if (!submitBtn.dataset.defaultText) {
      submitBtn.dataset.defaultText = submitBtn.textContent || 'Change password';
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Changing password…';

    try {
      const response = await fetch('{{ url_for("auth.update_password") }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          old_password: oldPassword,
          new_password: newPassword,
          confirm_password: confirmPassword,
        }),
      });

      const result = await response.json();

      if (result.success) {
        showAlert(result.message || 'Password changed successfully', 'success');
        form.reset();
        setTimeout(function() {
          window.location.href = '{{ url_for("dashboard.dashboard") }}';
        }, 2000);
      } else {
        showAlert(result.error || 'Failed to change password');
        submitBtn.disabled = false;
        submitBtn.textContent = submitBtn.dataset.defaultText;
      }
    } catch (error) {
      console.error('Error changing password:', error);
      showAlert('An error occurred while changing password. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = submitBtn.dataset.defaultText;
    }
  });

  const newPasswordInput = document.getElementById('newPassword');
  const confirmPasswordInput = document.getElementById('confirmPassword');

  function validatePasswordMatch() {
    if (confirmPasswordInput.value && newPasswordInput.value !== confirmPasswordInput.value) {
      confirmPasswordInput.setCustomValidity('Passwords do not match');
    } else {
      confirmPasswordInput.setCustomValidity('');
    }
  }

  newPasswordInput.addEventListener('input', validatePasswordMatch);
  confirmPasswordInput.addEventListener('input', validatePasswordMatch);
});
</script>
{% endblock %}
