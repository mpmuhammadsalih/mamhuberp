{# fa_nav_active: categories | assets | depreciation | disposal | sale | transfer #}
<nav class="fa-nav-wrap" aria-label="Fixed assets sections">
  <div class="po-tabs" role="tablist">
    <a href="{{ url_for('fixed_assets.fa_category_list') }}"
       class="po-tab{% if fa_nav_active == 'categories' %} active{% endif %}"
       role="tab"
       {% if fa_nav_active == 'categories' %}aria-current="page"{% endif %}><i class="bi bi-tags" aria-hidden="true"></i> Categories</a>
    <a href="{{ url_for('fixed_assets.fa_asset_list') }}"
       class="po-tab{% if fa_nav_active == 'assets' %} active{% endif %}"

       {% if fa_nav_active == 'assets' %}aria-current="page"{% endif %}><i class="bi bi-building-gear" aria-hidden="true"></i> Asset register</a>
    <a href="{{ url_for('fixed_assets.fa_depreciation_page') }}"

    <a href="{{ url_for('fixed_assets.fa_sale_list') }}"

    <a href="{{ url_for('fixed_assets.fa_transfer_list') }}"
