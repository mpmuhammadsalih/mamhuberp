    <script>
      (function () {
        function nexaScrollbarPxFromEl(el) {
          if (!el) return 0;
          return Math.max(0, el.offsetWidth - el.clientWidth);
        }
        function nexaSyncScrollbarWidth() {
          try {
            var content = document.querySelector(".layout .content");
            var w = nexaScrollbarPxFromEl(content);
            if (!w) {
              var root = document.documentElement;
              w = Math.max(0, window.innerWidth - root.clientWidth);
            }
            document.documentElement.style.setProperty("--nexa-scrollbar-width", w + "px");
          } catch (e) {}
        }
        nexaSyncScrollbarWidth();
        window.addEventListener("resize", nexaSyncScrollbarWidth);
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) nexaSyncScrollbarWidth();
        });
        if (typeof requestAnimationFrame === "function") {
          requestAnimationFrame(function () {
            nexaSyncScrollbarWidth();
          });
        }
        document.addEventListener("DOMContentLoaded", function () {
          nexaSyncScrollbarWidth();
          var content = document.querySelector(".layout .content");
          if (content && typeof ResizeObserver !== "undefined") {
            var ro = new ResizeObserver(function () {
              nexaSyncScrollbarWidth();
            });
            ro.observe(content);
          }
        });
      })();
    </script>
    
    
    
    <script>
      window.nexaToggleSidebar = function (ev) {
        if (ev) {
          if (ev.preventDefault) ev.preventDefault();
          if (ev.stopPropagation) ev.stopPropagation();
        }
        var s = document.getElementById("sidebar");
        if (!s) return;
        var l = s.closest(".layout");
        if (!l) l = document.querySelector(".layout");
        if (!l) return;
        s.classList.toggle("collapsed");
        l.classList.toggle("sidebar-collapsed");
      };
    </script>
    <!-- Global loading overlay (use showLoadingOverlay() / hideLoadingOverlay() from any page) -->
    <div id="globalLoadingOverlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99999; align-items: center; justify-content: center; flex-direction: column; gap: 16px;">
      <div id="globalLoadingSpinner" class="global-loading-spinner" style="width: 56px; height: 56px; border: 4px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: global-loading-spin 0.8s linear infinite;"></div>
      <p id="globalLoadingOverlayText" style="margin: 0; color: #fff; font-weight: 600; font-size: 16px;">Loading…</p>
      <div id="globalLoadingProgressWrap" style="display: none; width: min(420px, 88vw);">
        <div style="background: #334155; border-radius: 999px; height: 10px; overflow: hidden;">
          <div id="globalLoadingProgressBar" style="height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #22c55e); transition: width 0.25s ease;"></div>
        </div>
        <p id="globalLoadingProgressDetail" style="margin: 8px 0 0; color: #e2e8f0; font-size: 13px; text-align: center;"></p>
      </div>
    </div>
    <style>
      @keyframes global-loading-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      window.showLoadingOverlay = function(message, opts) {
        opts = opts || {};
        var el = document.getElementById('globalLoadingOverlay');
        var text = document.getElementById('globalLoadingOverlayText');
        var progressWrap = document.getElementById('globalLoadingProgressWrap');
        var bar = document.getElementById('globalLoadingProgressBar');
        var detail = document.getElementById('globalLoadingProgressDetail');
        var spinner = document.getElementById('globalLoadingSpinner');
        if (text) text.textContent = message || 'Loading…';
        if (opts.progress && progressWrap && bar) {
          var cur = Number(opts.progress.current) || 0;
          var tot = Number(opts.progress.total) || 0;
          var pct = tot > 0 ? Math.min(100, Math.round((cur * 100) / tot)) : 0;
          progressWrap.style.display = 'block';
          bar.style.width = pct + '%';
          if (detail) detail.textContent = (opts.progress.detail || (cur + ' of ' + tot + ' items'));
          if (spinner) spinner.style.display = 'none';
        } else {
          if (progressWrap) progressWrap.style.display = 'none';
          if (bar) bar.style.width = '0%';
          if (detail) detail.textContent = '';
          if (spinner) spinner.style.display = 'block';
        }
        if (el) el.style.display = 'flex';
      };
      window.updateLoadingOverlayProgress = function(current, total, message, phase) {
        var cur = Number(current) || 0;
        var tot = Number(total) || 0;
        var phaseLabel = phase ? String(phase) : 'Processing';
        var msg = message || (phaseLabel + '…');
        var detail = phaseLabel + ': ' + cur + ' of ' + tot + ' items';
        window.showLoadingOverlay(msg, { progress: { current: cur, total: tot, detail: detail } });
      };
      window.hideLoadingOverlay = function() {
        var el = document.getElementById('globalLoadingOverlay');
        var progressWrap = document.getElementById('globalLoadingProgressWrap');
        var bar = document.getElementById('globalLoadingProgressBar');
        var detail = document.getElementById('globalLoadingProgressDetail');
        var spinner = document.getElementById('globalLoadingSpinner');
        if (progressWrap) progressWrap.style.display = 'none';
        if (bar) bar.style.width = '0%';
        if (detail) detail.textContent = '';
        if (spinner) spinner.style.display = 'block';
        if (el) el.style.display = 'none';
      };
    </script>

<style>

    border-radius: 4px;

  .login-po .form button[type="submit"]:hover {

  }
  .login-po .flash-list { margin-bottom: 8px; }

      max-height: 118px;

  }
</style>

    <script>
      (function () {
        function bootListRefresh() {
          try {
            if (typeof ListDataRefresh !== 'undefined' && typeof ListDataRefresh.bootstrapReloadToolbars === 'function') {
              ListDataRefresh.bootstrapReloadToolbars();
            }
          } catch (e) { /* non-list pages */ }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootListRefresh);
        else bootListRefresh();
      })();
    </script>

    <script>
      (function () {
        function disableAutocompleteProjectWide() {
          document.querySelectorAll('form').forEach(function (form) {
            if (form.hasAttribute('data-allow-autocomplete')) return;
            form.setAttribute('autocomplete', 'off');
          });
          document.querySelectorAll('input, textarea, select').forEach(function (el) {
            if (el.hasAttribute('data-allow-autocomplete')) return;
            el.setAttribute('autocomplete', 'off');
          });
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', disableAutocompleteProjectWide);
        } else {
          disableAutocompleteProjectWide();
        }
      })();
    </script>
    <script>
      (function () {
        // Block browser-level F1 help page everywhere in the app.
        function blockBrowserF1(event) {
          if (!event) return;
          if (event.key === 'F1' || event.keyCode === 112) {
            event.preventDefault();
          }
        }
        window.addEventListener('keydown', blockBrowserF1, true);
        document.addEventListener('keydown', blockBrowserF1, true);
      })();
    </script>
