# Legacy Docker Compose for the removed standalone FastAPI backend.
# MamaHub now uses Nova ERP for /api/v1 and admin.
#
# To run locally:
#   Nova:    cd d:\webapps\Nova && python app.py
#   Frontend: cd frontend && npm run dev

services:
  redis:
    image: redis:7-alpine
    container_name: mamahub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
