# Proxies to Nova ERP storefront API (port 5055).
# Run Nova on the host: cd d:\webapps\Nova && python app.py
upstream mamahub_api {
    server host.docker.internal:5055;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    location / {
        proxy_pass http://mamahub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://mamahub_api/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://mamahub_api/redoc;
        proxy_set_header Host $host;
    }
}
